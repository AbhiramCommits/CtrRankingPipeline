[project]
name = "ctr-ranking-pipeline"
version = "0.1.0"
description = "End-to-end ads click-through-rate (CTR) prediction and ranking pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
authors = [{ name = "CtrRankingPipeline contributors" }]
dependencies = [
    "pyspark==3.5.*",
    "torch==2.*",
    "faiss-cpu>=1.8,<1.10",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "pydantic>=2.6,<3",
    "scikit-learn>=1.4,<2",
    "lightgbm>=4.3,<5",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<2",
    "pandas>=2.1,<3",
    "pyarrow>=15.0,<16",
    "pyyaml>=6.0,<7",
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ctr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["ctr"]
branch = true
